<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DailyBudget — Personal Finance Tracker</title>
<meta name="description" content="DailyBudget helps you track income and expenses, set a daily spending limit, plan monthly budgets, manage bills and grow savings goals.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Content Security Policy: only allows scripts from jsDelivr and network calls to Supabase.
     If you use a custom Supabase domain, add it to connect-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312335B'/%3E%3Cpath d='M8 21a8 8 0 1 1 16 0' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M8 21a8 8 0 0 1 10.5-7.6' fill='none' stroke='%2334C27F' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</script>
<style>
:root{
  --navy:#12335B; --navy-deep:#0B2340; --navy-soft:#E8EEF6;
  --green:#17845A; --green-soft:#E3F3EA;
  --red:#C2412D; --red-soft:#FBEAE6;
  --amber:#A86A12; --amber-soft:#FBF1DE;
  --bg:#FFFFFF; --surface:#F5F7FA; --raised:#FFFFFF;
  --line:#E1E6EE; --text:#14202E; --muted:#5B6778;
  --accent:var(--navy); --on-accent:#FFFFFF;
  --radius-s:6px; --radius:10px; --radius-l:16px;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --navy:#7FA8DA; --navy-deep:#0A1524; --navy-soft:#1A2A40;
  --green:#3DBE86; --green-soft:#12301F;
  --red:#F07A63; --red-soft:#3A1A14;
  --amber:#E3A84A; --amber-soft:#33260F;
  --bg:#0E1621; --surface:#131E2C; --raised:#172435;
  --line:#25364C; --text:#E7EDF5; --muted:#9AA8BA;
  --accent:#7FA8DA; --on-accent:#0B1A2C;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.5vw,3.1rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.hidden{display:none!important}
.pos{color:var(--green)} .neg{color:var(--red)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Buttons & inputs */
.btn{font:inherit;font-weight:600;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--raised);color:var(--text);padding:.55rem 1rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:.3rem .65rem;font-size:.85rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.25rem}
input,select,textarea{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-s);padding:.55rem .7rem;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.field{margin-bottom:.85rem}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:.2rem}
.field .err{font-size:.8rem;color:var(--red);margin-top:.2rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.check{display:flex;align-items:flex-start;gap:.5rem;font-weight:500}
.check input{width:auto;margin-top:.25rem}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.seg label{flex:1;margin:0;text-align:center;padding:.5rem;cursor:pointer;font-weight:600;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked + span{color:var(--on-accent)}
.seg label:has(input:checked){background:var(--accent);color:var(--on-accent)}
.seg label:has(input:focus-visible){outline:3px solid var(--green);outline-offset:-3px}

/* Logo */
.logo{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.15rem;color:var(--text);text-decoration:none}
.logo svg{flex:none}

/* ---------- Landing ---------- */
.landing header{display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1rem,4vw,3rem);border-bottom:1px solid var(--line)}
.landing header nav{display:flex;gap:.5rem}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center;padding:clamp(2rem,6vw,5rem) clamp(1rem,4vw,3rem);max-width:1180px;margin:0 auto}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.hero .cta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem}
.demo-card{background:var(--navy-deep);color:#fff;border-radius:var(--radius-l);padding:1.6rem;box-shadow:0 30px 60px -30px rgba(11,35,64,.55)}
.demo-card .meta{color:#AFC3DC;font-size:.9rem}
.demo-card ul{list-style:none;padding:0;margin:1rem 0 0;border-top:1px solid #23446D}
.demo-card li{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #23446D;font-size:.95rem}
.features{max-width:1180px;margin:0 auto;padding:2rem clamp(1rem,4vw,3rem) 3rem;display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem 3rem}
.features div{padding-left:1.1rem;border-left:3px solid var(--green)}
.features p{color:var(--muted);margin:0}
.privacy{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.privacy .inner{max-width:1180px;margin:0 auto;padding:2.5rem clamp(1rem,4vw,3rem);display:grid;grid-template-columns:1fr 2fr;gap:2rem}
.privacy ul{margin:0;padding-left:1.1rem;color:var(--muted)}
.privacy li{margin-bottom:.4rem}
.landing footer{padding:1.5rem clamp(1rem,4vw,3rem);color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.setup-banner{background:var(--amber-soft);color:var(--text);border-bottom:1px solid var(--amber);padding:.8rem clamp(1rem,4vw,3rem);font-size:.9rem}

/* Gauge */
.gauge{position:relative;width:150px;height:150px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gauge .center strong{font-size:1.35rem;font-weight:800}
.gauge .center span{font-size:.75rem;opacity:.8}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--navy-deep);color:#D9E4F2;padding:1.1rem .8rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1rem}
.sidebar .logo{color:#fff;padding:0 .4rem}
.sidebar nav{display:flex;flex-direction:column;gap:2px}
.sidebar nav button{font:inherit;text-align:left;background:none;border:0;color:#C3D2E6;padding:.6rem .75rem;border-radius:var(--radius-s);cursor:pointer;font-weight:500}
.sidebar nav button:hover{background:#163257;color:#fff}
.sidebar nav button[aria-current="page"]{background:#1E416E;color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #34C27F}
.sidebar .who{margin-top:auto;font-size:.82rem;color:#9FB3CC;padding:.4rem;border-top:1px solid #1E3A60;word-break:break-all}
.topbar{display:none}
main{padding:1.6rem clamp(1rem,3vw,2.4rem) 4rem;min-width:0;background:var(--bg)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.3rem}
.page-head .actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end}
.page-head .actions .field{margin:0}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;min-width:0}
.panel h3{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:320px}

/* Today panel */
.today{background:var(--navy-deep);color:#fff;border-radius:var(--radius-l);padding:1.4rem 1.6rem;display:flex;gap:2rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
:root[data-theme="dark"] .today{background:#0A1830;border:1px solid var(--line)}
.today .facts{display:grid;grid-template-columns:repeat(3,auto);gap:.4rem 2.2rem;flex:1;min-width:240px}
.today .facts dt{font-size:.8rem;color:#AFC3DC}
.today .facts dd{margin:0 0 .6rem;font-size:1.25rem;font-weight:700}
.today .status{grid-column:1/-1;font-size:.95rem;padding:.55rem .8rem;border-radius:var(--radius-s);background:#173A63}
.today .status.warn{background:#5A3E0E}
.today .status.bad{background:#5E2015}
.today .status.good{background:#0F4A31}

/* Strips (figures separated by rules, not cards) */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:1rem;background:var(--raised)}
.strip > div{padding:.9rem 1.1rem;border-right:1px solid var(--line);min-width:0}
.strip > div:last-child{border-right:0}
.strip .k{font-size:.8rem;color:var(--muted);display:block}
.strip .v{font-size:1.2rem;font-weight:700;display:block;overflow-wrap:anywhere}
.strip .s{font-size:.75rem;color:var(--muted)}

/* Lists, tables */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:.8rem;padding:.6rem 0;border-bottom:1px solid var(--line);align-items:center}
.list li:last-child{border-bottom:0}
.list .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.list .m{font-size:.8rem;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--raised)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;background:var(--surface);white-space:nowrap}
td.amt,th.amt{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .desc{font-weight:600}
td .note{font-size:.8rem;color:var(--muted);max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:.12rem .5rem;border-radius:99px;background:var(--surface);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.navy{background:var(--navy-soft);color:var(--navy);border-color:transparent}
.bar{height:8px;background:var(--surface);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.amber > i{background:var(--amber)} .bar.red > i{background:var(--red)}
.bar.big{height:14px}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
.filters .field{margin:0;min-width:130px}
.filters .field.grow{flex:1;min-width:200px}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--muted)}
.empty h3{color:var(--text)}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tabs button{font:inherit;font-weight:600;background:none;border:0;padding:.6rem .9rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--green)}
.goal{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .bar{grid-column:1/-1}
.insight{padding:.75rem .9rem;border-left:3px solid var(--navy);background:var(--surface);border-radius:0 var(--radius-s) var(--radius-s) 0;margin-bottom:.6rem}
.insight.good{border-color:var(--green)} .insight.warn{border-color:var(--amber)} .insight.bad{border-color:var(--red)}
.note-box{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-s);padding:.7rem .9rem;margin-bottom:1rem}
.settings-section{max-width:640px;margin-bottom:1.6rem}
.settings-section h2{padding-bottom:.4rem;border-bottom:1px solid var(--line);margin-bottom:1rem}

/* Modal, toast */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,32,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.modal{background:var(--raised);color:var(--text);border-radius:var(--radius-l);width:min(560px,100%);max-height:92vh;overflow:auto;padding:1.4rem 1.5rem;border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(0,0,0,.45)}
.modal.narrow{width:min(420px,100%)}
.modal .foot{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.modal .close{float:right;margin:-.4rem -.6rem 0 0}
#toasts{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:60;max-width:min(380px,calc(100vw - 2rem))}
.toast{background:var(--navy-deep);color:#fff;padding:.75rem 1rem;border-radius:var(--radius);box-shadow:0 10px 30px -10px rgba(0,0,0,.4);font-size:.92rem;border-left:4px solid #34C27F}
.toast.error{border-left-color:#F07A63} .toast.warn{border-left-color:#E3A84A}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted)}
.fab{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .grid3{grid-template-columns:1fr 1fr}
  .strip{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
  .strip > div{border-bottom:1px solid var(--line)}
}
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .features{grid-template-columns:1fr}
  .privacy .inner{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
  .grid2,.grid3{grid-template-columns:1fr}
  .fab{display:flex;position:fixed;right:1rem;bottom:1rem;z-index:35;border-radius:99px;padding:.8rem 1.2rem;box-shadow:0 10px 25px -8px rgba(0,0,0,.45)}
  #toasts{bottom:5rem}
}
@media (max-width:640px){
  body{font-size:15px}
  .row{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr 1fr}
  .today{padding:1.1rem;gap:1rem;justify-content:center}
  .today .facts{grid-template-columns:1fr 1fr;gap:.2rem 1rem}
  .gauge{width:130px;height:130px}
  .gauge svg{width:130px;height:130px}
  /* Stack table rows into cards */
  table.stackable thead{display:none}
  table.stackable tr{display:grid;grid-template-columns:1fr auto;gap:.15rem .6rem;padding:.7rem .8rem;border-bottom:1px solid var(--line)}
  table.stackable td{border:0;padding:0}
  table.stackable td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:.78rem}
  table.stackable td.amt{grid-row:1;grid-column:2;text-align:right}
  table.stackable td.acts{grid-column:1/-1}
  .chart-box{height:220px}
}
</style>
</head>
<body>

<div id="root"><div class="loading">Loading DailyBudget…</div></div>
<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   CONFIGURATION — replace these two values with your own project's.
   Supabase Dashboard → Project Settings → API (or "API Keys").
   Use the PUBLISHABLE key (sb_publishable_...) or the legacy ANON key.
   NEVER put the service_role / secret key or your database password here:
   anyone can read this file on GitHub Pages.
   ===================================================================== */
const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
const SUPABASE_PUBLIC_KEY = "YOUR-PUBLISHABLE-OR-ANON-KEY";

/* ===================================================================== */
const CONFIGURED = !/YOUR-/.test(SUPABASE_URL + SUPABASE_PUBLIC_KEY) && /^https:\/\//.test(SUPABASE_URL);
const sb = (CONFIGURED && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } })
  : null;

/* ---------- Constants ---------- */
const INCOME_CATS = ["Salary","Business income","Freelance","Gifts","Refunds","Other income"];
const EXPENSE_CATS = ["Rent or mortgage","Groceries","Restaurants","Transportation","Fuel","Utilities","Phone and internet","Healthcare","Education","Shopping","Family expenses","Insurance","Debt payments","Subscriptions","Entertainment","Other expenses"];
const TRANSFER_CATS = ["Credit card payment","Move to savings","Between my accounts"];
const PAY = {cash:"Cash",debit_card:"Debit card",credit_card:"Credit card",bank_transfer:"Bank transfer",mobile_wallet:"Mobile wallet",other:"Other"};
const BILL_CATS = ["Rent","Utilities","Phone and internet","Insurance","Loan payment","Credit card bill","Subscription","Other bill"];
const BILL_TO_EXPENSE = {"Rent":"Rent or mortgage","Utilities":"Utilities","Phone and internet":"Phone and internet","Insurance":"Insurance","Loan payment":"Debt payments","Subscription":"Subscriptions","Other bill":"Other expenses"};
const RECUR = {once:"One time",weekly:"Weekly",monthly:"Monthly",annually:"Yearly"};
const GOAL_KINDS = ["Emergency fund","House","Car","Education","Vacation","General savings"];
const CURRENCIES = ["USD","EUR","GBP","CAD","AUD","NZD","INR","PKR","BDT","LKR","NGN","KES","ZAR","GHS","JPY","CNY","SGD","PHP","MYR","IDR","AED","SAR","MXN","BRL","CHF","SEK"];
const TOTAL_KEY = "__total__";
const PALETTE = ["#12335B","#17845A","#3A6EA5","#6BAF92","#A86A12","#8E5A9B","#C2412D","#2B8C9E","#D4A24C","#5D6F87","#9BB7D4","#B5D8C4"];
const NAV = [["dashboard","Dashboard"],["transactions","Transactions"],["daily","Daily budget"],["budgets","Monthly budget"],["bills","Bills"],["goals","Savings goals"],["reports","Reports"],["settings","Settings"]];

/* ---------- State ---------- */
const S = {
  user:null, profile:null,
  prefs:{currency:"USD",daily_limit:0,rollover:false,opening_balance:0,theme:"light"},
  tx:[], budgets:[], bills:[], goals:[],
  view:"dashboard", charts:{}, loaded:false,
  dashDate:null, budgetMonth:null, billTab:"upcoming",
  txf:{q:"",type:"all",cat:"all",range:"month",from:"",to:"",sort:"date_desc",limit:150},
  rep:{from:"",to:""}, warned:{}
};

/* ---------- Helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const monthStart = s => s.slice(0,7) + "-01";
const monthEnd = s => { const d = parseISO(monthStart(s)); return iso(new Date(d.getFullYear(), d.getMonth()+1, 0)); };
const addMonths = (s,n) => { const d = parseISO(s), day = d.getDate(); const t = new Date(d.getFullYear(), d.getMonth()+n, 1); const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return iso(t); };
const weekStart = s => { const d = parseISO(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); };
const daysBetween = (a,b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const fmtDate = s => s ? parseISO(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";
const fmtShortDate = s => parseISO(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const monthLabel = s => parseISO(monthStart(s)).toLocaleDateString(undefined,{month:"long",year:"numeric"});
const toC = v => Math.round(Number(v) * 100);
const sumC = list => list.reduce((a,t) => a + t.c, 0);
const pct = (a,b) => b > 0 ? Math.round(a / b * 100) : 0;
function fmt(c){ try { return new Intl.NumberFormat(undefined,{style:"currency",currency:S.prefs.currency||"USD"}).format(c/100); } catch(e){ return (c/100).toFixed(2); } }
function fmtCompact(v){ try { return new Intl.NumberFormat(undefined,{style:"currency",currency:S.prefs.currency||"USD",notation:"compact",maximumFractionDigits:1}).format(v); } catch(e){ return v; } }
function validDate(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||"")) return false; const d = parseISO(s); return iso(d) === s && d.getFullYear() >= 1900 && d.getFullYear() <= 2100; }
function parseAmount(v, {allowZero=false, allowNeg=false}={}){
  let s = String(v ?? "").trim().replace(/,/g,"");
  let neg = false;
  if (allowNeg && s.startsWith("-")) { neg = true; s = s.slice(1); }
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  const n = Number(s);
  if (!Number.isFinite(n) || n > 9999999999.99) return null;
  if (n === 0 && !allowZero) return null;
  return Math.round(n*100) * (neg ? -1 : 1);
}
const uniq = a => [...new Set(a)];
const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; };
const appURL = () => location.origin + location.pathname;
const catOptions = (list, sel) => list.map(c => `<option ${c===sel?"selected":""}>${esc(c)}</option>`).join("");
const catLabel = c => c === TOTAL_KEY ? "All spending (overall)" : c;

/* ---------- Toasts, modals, confirm ---------- */
function toast(msg, kind=""){
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "error" ? 7000 : 4200);
}
let lastFocus = null;
function openModal(html, {narrow=false, onOpen}={}){
  lastFocus = document.activeElement;
  $("#modal-root").innerHTML = `<div class="modal-bg" data-bg><div class="modal ${narrow?"narrow":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const m = $("#modal-root .modal");
  const first = m.querySelector("input:not([type=hidden]):not([type=radio]),select,textarea,button.primary");
  if (first) first.focus();
  onOpen && onOpen(m);
  return m;
}
function closeModal(){ $("#modal-root").innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal();
  if (e.key === "Tab" && $("#modal-root .modal")) {
    const f = $$("#modal-root .modal button, #modal-root .modal input, #modal-root .modal select, #modal-root .modal textarea, #modal-root .modal a").filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;

    else if (!e.shiftKey && document.activeElement === f[f.length-1]) { e.preventDefault(); f[0].focus(); }

});

function clearErrs(form){ $$(".err", form).forEach(e => e.remove()); $$("[aria-invalid]", form).forEach(e => e.removeAttribute("aria-invalid")); }

/* ---------- Error handling ---------- */
function friendly(err){
  const m = String(err?.message || "").toLowerCase();
  if (m.includes("failed to fetch") || m.includes("network")) return "Check your internet connection and try again.";
  if (err?.code === "23505") return "That entry already exists.";
  if (err?.code === "23514") return "A value is outside the allowed range.";
  if (err?.code === "42P01") return "The database tables are missing. Run supabase_setup.sql in Supabase.";
  if (m.includes("invalid login")) return "Email or password is incorrect.";
  if (m.includes("email not confirmed")) return "Confirm your email first. Check your inbox for the link.";
  if (m.includes("already registered")) return "An account with this email already exists. Try logging in.";
  if (m.includes("rate limit")) return "Too many attempts. Wait a minute and try again.";
  if (m.includes("password")) return err.message;
  return "Please try again.";
}
let signingOut = false;
function dbErr(error, what){
  if (!error) return false;
  const m = String(error.message||"").toLowerCase();
  if (error.status === 401 || m.includes("jwt")) {
    if (!signingOut){ signingOut = true; toast("Your session has expired. Log in again.","error"); sb.auth.signOut().finally(() => signingOut = false); }
    return true;
  }
  toast(`Couldn't ${what}. ${friendly(error)}`, "error");
  return true;
}

/* ---------- Calculations ---------- */
const isInc = t => t.type === "income";
const isExp = t => t.type === "expense";
const inRange = (t, a, b) => t.txn_date >= a && t.txn_date <= b;
// Day-to-day spending: expenses on that date, excluding payments linked to bills (bills are planned separately).
const daySpent = d => sumC(S.tx.filter(t => isExp(t) && t.txn_date === d && !t.bill_id));

function dailyStatus(d){
  const L = toC(S.prefs.daily_limit || 0);
  let carry = 0;
  if (S.prefs.rollover && L > 0){
    // Rollover rule: starting on the 1st of the month (or the day you joined, if later),
    // each earlier day adds (limit − spent). The running carry never drops below zero
    // and resets on the 1st of every month.
    const joined = (S.profile?.created_at || "").slice(0,10);
    let x = monthStart(d); if (validDate(joined) && joined > x) x = joined;
    for (; x < d; x = addDays(x,1)) { carry += L - daySpent(x); if (carry < 0) carry = 0; }
  }
  const limit = L + carry, spent = daySpent(d), left = limit - spent, p = limit > 0 ? spent/limit*100 : 0;
  let level = "none";
  if (limit > 0) level = spent > limit ? "over" : spent === limit ? "full" : p >= 80 ? "high" : p >= 50 ? "half" : "ok";
  return { base:L, carry, limit, spent, left, p, level };
}
const LEVEL_TEXT = {
  none:["", "No daily limit set yet. Set one to see what's left each day."],
  ok:["good","You're on track today."],
  half:["warn","Heads-up: you've used half of today's budget."],
  high:["warn","Careful: 80% of today's budget is spent."],
  full:["bad","You've reached today's limit."],
  over:["bad","You're over today's budget."]
};

function moneyPosition(){
  const opening = toC(S.prefs.opening_balance || 0);
  const inc = sumC(S.tx.filter(isInc)), exp = sumC(S.tx.filter(isExp));
  const net = opening + inc - exp;
  const cardBought = sumC(S.tx.filter(t => isExp(t) && t.payment_method === "credit_card"));
  const cardPaid = sumC(S.tx.filter(t => t.type === "transfer" && t.category === "Credit card payment"));
  const owed = Math.max(0, cardBought - cardPaid);
  const cash = net + owed;
  const goals = S.goals.reduce((a,g) => a + g.sc, 0);
  return { net, owed, cash, goals, free: cash - goals };
}

function monthBudgets(m){ return S.budgets.filter(b => b.month === monthStart(m)); }
function catSpent(cat, a, b){ return sumC(S.tx.filter(t => isExp(t) && inRange(t,a,b) && (cat === TOTAL_KEY || t.category === cat))); }
function budgetRows(m){
  const a = monthStart(m), b = monthEnd(m);
  return monthBudgets(m).map(bu => { const spent = catSpent(bu.category, a, b); const p = pct(spent, bu.c); return {...bu, spent, left: bu.c - spent, p, status: p > 100 ? "over" : p >= 80 ? "close" : "ok"}; })
    .sort((x,y) => (x.category===TOTAL_KEY ? -1 : y.category===TOTAL_KEY ? 1 : y.p - x.p));
}
const statusChip = s => s === "over" ? `<span class="chip red">Over budget</span>` : s === "close" ? `<span class="chip amber">Close to limit</span>` : `<span class="chip green">On track</span>`;
const barClass = p => p > 100 ? "red" : p >= 80 ? "amber" : "";

function billState(b){ const t = todayISO(); if (b.status === "paid") return "paid"; return b.due_date < t ? "overdue" : "upcoming"; }
function nextDue(d, r){ return r === "weekly" ? addDays(d,7) : r === "monthly" ? addMonths(d,1) : r === "annually" ? addMonths(d,12) : d; }

function insights(endDate){
  const out = [];
  const e = endDate || todayISO(), m0 = monthStart(e), m1 = e;
  const prevStart = addMonths(m0,-1), prevSameDay = addMonths(e,-1) < prevStart ? prevStart : addMonths(e,-1);
  const cur = S.tx.filter(t => isExp(t) && inRange(t,m0,m1)), prev = S.tx.filter(t => isExp(t) && inRange(t,prevStart,prevSameDay));
  if (!S.tx.length) return out;
  // Category change vs the same point last month
  if (cur.length && prev.length){
    const cats = uniq([...cur, ...prev].map(t => t.category));
    const diffs = cats.map(c => ({c, d: sumC(cur.filter(t=>t.category===c)) - sumC(prev.filter(t=>t.category===c))})).filter(x => x.d !== 0).sort((a,b) => Math.abs(b.d) - Math.abs(a.d));
    const up = diffs.find(x => x.d > 0), down = diffs.find(x => x.d < 0);
    if (up) out.push(["warn", `You've spent ${fmt(up.d)} more on ${up.c} so far this month than by the same day last month.`]);
    if (down) out.push(["good", `You've spent ${fmt(-down.d)} less on ${down.c} than by this point last month.`]);
  }
  // Budget usage
  budgetRows(e).filter(r => r.p >= 80).slice(0,3).forEach(r => out.push([r.p > 100 ? "bad" : "warn", `You've used ${r.p}% of your ${catLabel(r.category).toLowerCase()} budget (${fmt(r.spent)} of ${fmt(r.c)}).`]));
  // Non-essential
  const nonEss = sumC(cur.filter(t => !t.essential)), totalCur = sumC(cur);
  if (nonEss > 0 && totalCur > 0) out.push(["", `Non-essential spending this month is ${fmt(nonEss)} (${pct(nonEss,totalCur)}% of expenses). Cutting it by a quarter would keep about ${fmt(Math.round(nonEss/4))} in your pocket.`]);
  // Savings rate
  const inc = sumC(S.tx.filter(t => isInc(t) && inRange(t,m0,m1)));
  if (inc > 0) { const r = pct(inc - totalCur, inc); out.push([r >= 0 ? "good" : "bad", r >= 0 ? `You've kept ${r}% of this month's income so far (${fmt(inc - totalCur)}).` : `This month's expenses are ${fmt(totalCur - inc)} more than your income so far.`]); }
  // Average daily
  const days = daysBetween(m0, m1) + 1;
  if (cur.length) out.push(["", `Average spending this month: ${fmt(Math.round(totalCur / days))} per day over ${days} day${days>1?"s":""}.`]);
  // Overdue bills
  const od = S.bills.filter(b => billState(b) === "overdue");
  if (od.length) out.push(["bad", `${od.length} bill${od.length>1?"s are":" is"} overdue, totaling ${fmt(sumC(od))}.`]);
  return out;
}

function catTotals(list){

  if (arr.length > 9){ const rest = arr.splice(8); arr.push({cat:"Everything else", c: rest.reduce((a,x)=>a+x.c,0)}); }
  return arr;
}

        <div class="field"><label for="t-pay">Paid with / received by</label><select id="t-pay" name="payment_method">${Object.entries(PAY).map(([v,l]) => `<option value="${v}" ${t.payment_method===v?"selected":""}>${l}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="t-desc">Description</label><input id="t-desc" name="description" maxlength="200" value="${esc(t.description||"")}" placeholder="e.g. Weekly groceries"></div>
      <div class="field" id="ess-wrap"><label class="check"><input type="checkbox" name="essential" ${t.essential!==false?"checked":""}> Essential expense (needed, not optional)</label></div>
      <div class="field"><label for="t-notes">Notes (optional)</label><textarea id="t-notes" name="notes" maxlength="1000">${esc(t.notes||"")}</textarea></div>

    </form>`);
  const form = $("#tx-form", m);

    const ty = form.type.value; const cats = catsFor(ty);
    const cur = form.category.value || t.category;
    form.category.innerHTML = catOptions(uniq(cats.includes(t.category) || !t.category || t.type!==ty ? cats : [...cats, t.category]), cats.includes(cur) || cur===t.category ? cur : cats[0]);
    $("#ess-wrap", m).classList.toggle("hidden", ty !== "expense");
    $("#ty-hint", m).textContent = ty === "transfer" ? "Transfers move money without being income or spending — e.g. paying off your credit card. Card purchases are already counted as expenses when you make them." : ty === "expense" ? "Paid by credit card? Record it here once. When you later pay the card bill, add it as a Transfer so it isn't counted twice." : "";
  };
  form.addEventListener("change", e => { if (e.target.name === "type") { form.category.value = ""; sync(); } });
  sync();
  form.addEventListener("submit", async e => {
    e.preventDefault(); clearErrs(form);
    const c = parseAmount(form.amount.value), date = form.txn_date.value, desc = form.description.value.trim(), notes = form.notes.value.trim();
    let ok = true;
    if (c === null) { fieldErr(form,"amount","Enter an amount greater than 0, with up to 2 decimals."); ok = false; }
    if (!validDate(date)) { fieldErr(form,"txn_date","Choose a valid date."); ok = false; }
    if (desc.length > 200) { fieldErr(form,"description","Keep it under 200 characters."); ok = false; }
    if (!ok) return;
    const ty = form.type.value;
    const row = { user_id: S.user.id, type: ty, amount: c/100, currency: S.prefs.currency, txn_date: date, category: form.category.value, description: desc, payment_method: form.payment_method.value, essential: ty === "expense" ? form.essential.checked : true, notes: notes || null };
    const btn = form.querySelector("button[type=submit]"); setBusy(btn, true);
    const res = isEdit ? await sb.from("transactions").update(row).eq("id", t.id) : await sb.from("transactions").insert(row);
    setBusy(btn, false);
    if (dbErr(res.error, "save the transaction")) return;
    closeModal(); toast(isEdit ? "Transaction updated." : "Transaction added.");
    await reload("transactions"); renderView();
    if (ty === "expense") afterExpenseAlerts(date, row.category);
  });
}
function afterExpenseAlerts(date, cat){
  if (date === todayISO()){
    const ds = dailyStatus(date);
    const order = ["ok","half","high","full","over"];
    const key = date + ":" + ds.level, prevIdx = order.indexOf(S.warned.daily || "ok");
    if (["half","high","full","over"].includes(ds.level) && !S.warned[key] && order.indexOf(ds.level) > (S.warned.dailyDate === date ? prevIdx : 0)){
      S.warned[key] = true; S.warned.daily = ds.level; S.warned.dailyDate = date;
      toast(LEVEL_TEXT[ds.level][1] + ` ${fmt(Math.max(ds.left,0))} left.`, ds.level==="over"||ds.level==="full" ? "error" : "warn");
    }
  }
  budgetRows(date).filter(r => r.category === cat || r.category === TOTAL_KEY).forEach(r => {
    const k = `b:${r.id}:${r.status}`;
    if (r.status !== "ok" && !S.warned[k]) { S.warned[k] = true; toast(r.status === "over" ? `${catLabel(r.category)} budget exceeded: ${fmt(r.spent)} of ${fmt(r.c)}.` : `${catLabel(r.category)} budget is at ${r.p}%.`, r.status==="over"?"error":"warn"); }
  });
}
async function deleteTx(id){
  const t = S.tx.find(x => x.id === id); if (!t) return;
  if (!(await confirmBox("Delete this transaction?", `${t.description || t.category} — ${fmt(t.c)} on ${fmtDate(t.txn_date)}. This can't be undone.`))) return;
  const { error } = await sb.from("transactions").delete().eq("id", id);
  if (dbErr(error, "delete the transaction")) return;
  toast("Transaction deleted."); await reload("transactions"); renderView();
}

async function copyBudgets(){
  const m = S.budgetMonth, prev = monthStart(addMonths(m,-1));
  const src = monthBudgets(prev), have = monthBudgets(m).map(b => b.category);

/* ---------- CSV export (formula-injection safe) ---------- */
function csvCell(v){
  let s = v == null ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s;   // neutralise spreadsheet formulas, keep plain negative numbers
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function downloadFile(name, content, type){
  const blob = new Blob([content], { type });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function txCSV(list){
  const head = ["Date","Type","Category","Description","Amount","Currency","Payment method","Essential","Linked bill","Notes","Created","Updated"];
  const rows = list.map(t => [t.txn_date, t.type, t.category, t.description, (t.c/100).toFixed(2), t.currency, PAY[t.payment_method]||t.payment_method, t.type==="expense"?(t.essential?"Yes":"No"):"", t.bill_id?(S.bills.find(b=>b.id===t.bill_id)?.name||"Yes"):"", t.notes||"", t.created_at, t.updated_at]);
  return "\uFEFF" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
}
function exportTx(list, name){ if (!list.length) return toast("There's nothing to export in this view.","warn"); downloadFile(name, txCSV(list), "text/csv;charset=utf-8"); toast(`Exported ${list.length} transaction${list.length>1?"s":""}.`); }
function exportSummary(){
  const {from,to} = S.rep, list = S.tx.filter(x => inRange(x,from,to));
  const inc = sumC(list.filter(isInc)), exp = sumC(list.filter(isExp));
  const rows = [["DailyBudget summary"],["From",from],["To",to],["Currency",S.prefs.currency],[],["Total income",(inc/100).toFixed(2)],["Total expenses",(exp/100).toFixed(2)],["Net",((inc-exp)/100).toFixed(2)],[],["Category","Spent","Share %"]];
  catTotals(list.filter(isExp)).forEach(c => rows.push([c.cat,(c.c/100).toFixed(2),pct(c.c,exp)]));
  rows.push([],["Month","Income","Expenses"]);
  for (let m = monthStart(from); m <= to; m = addMonths(m,1)) rows.push([m.slice(0,7),(sumC(list.filter(t=>isInc(t)&&inRange(t,m,monthEnd(m))))/100).toFixed(2),(sumC(list.filter(t=>isExp(t)&&inRange(t,m,monthEnd(m))))/100).toFixed(2)]);
  const br = budgetRows(to); if (br.length){ rows.push([],[`Budgets for ${to.slice(0,7)}`,"Budget","Spent","Remaining","Used %"]); br.forEach(r => rows.push([catLabel(r.category),(r.c/100).toFixed(2),(r.spent/100).toFixed(2),(r.left/100).toFixed(2),r.p])); }
  downloadFile(`dailybudget-summary-${from}-to-${to}.csv`, "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n"), "text/csv;charset=utf-8");
  toast("Summary exported.");
}

}

  <section class="settings-section"><h2>Profile</h2>
    <form id="profile-form" novalidate>
      <div class="field"><label for="s-name">Your name</label><input id="s-name" name="name" maxlength="80" value="${esc(S.profile?.display_name||"")}"></div>
      <div class="field"><label>Email</label><input value="${esc(S.user.email)}" disabled></div>
      <button class="btn primary" type="submit">Save profile</button>
    </form></section>
  <section class="settings-section"><h2>Money</h2>
    <form id="money-form" novalidate>
      <div class="row"><div class="field"><label for="s-cur">Currency</label><select id="s-cur" name="currency">${uniq([S.prefs.currency, ...CURRENCIES]).map(c => `<option ${c===S.prefs.currency?"selected":""}>${c}</option>`).join("")}</select><div class="hint">Changes how amounts are shown. It doesn't convert past amounts.</div></div>
        <div class="field"><label for="s-open">Starting balance</label><input id="s-open" name="opening" inputmode="decimal" value="${(toC(S.prefs.opening_balance||0)/100).toFixed(2)}"><div class="hint">Money in your accounts before you started tracking. Can be negative.</div></div></div>
      <button class="btn primary" type="submit">Save money settings</button>
    </form></section>
  <section class="settings-section"><h2>Appearance</h2>
    <div class="seg" role="radiogroup" aria-label="Theme" style="max-width:280px">${[["light","Light"],["dark","Dark"]].map(([v,l]) => `<label><input type="radio" name="theme" value="${v}" ${(S.prefs.theme||"light")===v?"checked":""} data-change="theme">${l}</label>`).join("")}</div></section>
  <section class="settings-section"><h2>Your data</h2>
    <p class="muted">Your records are saved in your private database account and sync across devices. Download a copy anytime.</p>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" data-act="export-all">Export all transactions (CSV)</button><button class="btn" data-act="backup">Download full backup (JSON)</button></div>
    <h3 style="margin-top:1.2rem">Sample data</h3>
    <p class="muted small">Sample entries are marked and can be removed without touching your own records.</p>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" data-act="load-demo">Load sample data</button><button class="btn danger" data-act="clear-demo" ${hasDemo?"":"disabled"}>Remove sample data</button></div></section>
  <section class="settings-section"><h2>Security</h2>
    <form id="pw-form" novalidate>
      <div class="row"><div class="field"><label for="s-pw">New password</label><input id="s-pw" name="pw" type="password" autocomplete="new-password"></div><div class="field"><label for="s-pw2">Repeat new password</label><input id="s-pw2" name="pw2" type="password" autocomplete="new-password"></div></div>
      <button class="btn" type="submit">Change password</button> <button class="btn" type="button" data-act="logout">Log out</button>
    </form></section>
  <section class="settings-section"><h2>Delete account</h2>
    <p class="muted">Permanently deletes your account and every transaction, budget, bill and goal. Download a backup first if you want a copy.</p>

function bindSettings(){
  $("#profile-form")?.addEventListener("submit", async e => {
    e.preventDefault(); const name = e.target.name.value.trim().slice(0,80);
    const { data, error } = await sb.from("profiles").update({ display_name: name || null }).eq("id", S.user.id).select().single();
    if (dbErr(error,"save your profile")) return;
    S.profile = data; toast("Profile saved."); renderShell();
  });
  $("#money-form")?.addEventListener("submit", async e => {
    e.preventDefault(); const f = e.target; clearErrs(f);
    const c = parseAmount(f.opening.value, {allowZero:true, allowNeg:true});
    if (c === null) return fieldErr(f,"opening","Enter an amount like 1250.00 or -300.00.");
    if (!/^[A-Z]{3}$/.test(f.currency.value)) return fieldErr(f,"currency","Choose a currency.");
    await savePrefs({ currency: f.currency.value, opening_balance: c/100 }, "Money settings saved.");
  });
  $("#pw-form")?.addEventListener("submit", async e => {
    e.preventDefault(); const f = e.target; clearErrs(f);
    if (f.pw.value.length < 8) return fieldErr(f,"pw","Password must be at least 8 characters.");
    if (f.pw.value !== f.pw2.value) return fieldErr(f,"pw2","Passwords don't match.");
    const { error } = await sb.auth.updateUser({ password: f.pw.value });
    if (error) return toast(friendly(error),"error");
    f.reset(); toast("Password changed.");
  });
}
function applyTheme(t){ t = t === "dark" ? "dark" : "light"; document.documentElement.dataset.theme = t; try { localStorage.setItem("db-theme", t); } catch(e){} }

/* ---------- Sample data ---------- */
async function loadDemo(){
  if (!(await confirmBox("Load sample data?", "Adds about two months of example income, expenses, budgets, bills and goals. They're marked as samples and you can remove them in Settings.", {okText:"Load sample data", danger:false}))) return;
  const uid = S.user.id, t = todayISO(), cur = S.prefs.currency, tx = [];
  const add = (type, d, amount, category, description, pm="debit_card", essential=true) => { if (d <= t) tx.push({ user_id:uid, type, amount, currency:cur, txn_date:d, category, description, payment_method:pm, essential, is_demo:true }); };
  for (let i = 1; i >= 0; i--){
    const m = monthStart(addMonths(t,-i));
    add("income", m, 2400, "Salary", "Monthly salary (sample)", "bank_transfer");
    add("income", addDays(m,14), 350, "Freelance", "Design job (sample)", "bank_transfer");
    add("expense", m, 1100, "Rent or mortgage", "Rent (sample)", "bank_transfer");
    add("expense", addDays(m,4), 64.99, "Phone and internet", "Internet (sample)", "debit_card");
    add("expense", addDays(m,9), 92.40, "Utilities", "Electricity (sample)", "bank_transfer");
    add("expense", addDays(m,11), 15.49, "Subscriptions", "Streaming (sample)", "credit_card", false);
    add("expense", addDays(m,17), 120, "Insurance", "Car insurance (sample)", "bank_transfer");
    add("transfer", addDays(m,20), 180, "Credit card payment", "Card payment (sample)", "bank_transfer");
    for (let w = 0; w < 5; w++){
      const d = addDays(m, w*7 + 2);
      if (d.slice(0,7) !== m.slice(0,7)) continue;
      add("expense", d, [78.35,64.20,91.10,58.75,70.00][w], "Groceries", "Groceries (sample)", "debit_card");
      add("expense", addDays(d,1), [24.50,31.00,18.75,42.30,27.60][w], "Restaurants", "Eating out (sample)", "credit_card", false);
      add("expense", addDays(d,2), [40,35.5,42,38,41][w], "Fuel", "Fuel (sample)", "debit_card");
      add("expense", addDays(d,3), [6.5,5,7.25,4.75,6][w], "Transportation", "Bus fare (sample)", "cash");
      if (w % 2 === 0) add("expense", addDays(d,4), [45,29.99,60][w/2], "Shopping", "Shopping (sample)", "credit_card", false);
      if (w === 1) add("expense", addDays(d,5), 22, "Entertainment", "Cinema (sample)", "cash", false);
    }
  }
  add("expense", t, 12.40, "Restaurants", "Lunch (sample)", "credit_card", false);
  add("expense", t, 8.90, "Groceries", "Snacks (sample)", "cash");
  const m0 = monthStart(t);
  const budgets = [["Groceries",320],["Restaurants",120],["Fuel",160],["Transportation",40],["Shopping",120],["Entertainment",60],[TOTAL_KEY,2200]]
    .filter(([c]) => !monthBudgets(t).some(b => b.category === c)).map(([category, amount]) => ({ user_id:uid, month:m0, category, amount, is_demo:true }));
  const bills = [
    { name:"Rent (sample)", category:"Rent", amount:1100, due_date: monthStart(addMonths(t,1)), recurrence:"monthly" },
    { name:"Internet (sample)", category:"Phone and internet", amount:64.99, due_date: addDays(t,5), recurrence:"monthly" },
    { name:"Electricity (sample)", category:"Utilities", amount:92.40, due_date: addDays(t,-2), recurrence:"monthly" },
    { name:"Credit card (sample)", category:"Credit card bill", amount:180, due_date: addDays(t,12), recurrence:"monthly" },
    { name:"Car insurance (sample)", category:"Insurance", amount:120, due_date: addDays(t,20), recurrence:"monthly" }
  ].map(b => ({...b, user_id:uid, status:"unpaid", is_demo:true}));
  const goals = [
    { name:"Emergency fund (sample)", kind:"Emergency fund", target_amount:5000, saved_amount:1850, target_date: addMonths(t,10), description:"Three months of essential costs" },
    { name:"Summer trip (sample)", kind:"Vacation", target_amount:1500, saved_amount:420, target_date: addMonths(t,6) }
  ].map(g => ({...g, user_id:uid, is_demo:true}));
  const results = await Promise.all([ sb.from("transactions").insert(tx), budgets.length ? sb.from("budgets").insert(budgets) : {error:null}, sb.from("bills").insert(bills), sb.from("savings_goals").insert(goals) ]);
  if (results.some(r => dbErr(r.error, "load sample data"))) return;
  if (!toC(S.prefs.daily_limit)) await sb.from("preferences").update({ daily_limit: 60 }).eq("user_id", uid).then(r => { if (!r.error) S.prefs.daily_limit = 60; });
  await Promise.all(["transactions","budgets","bills","goals"].map(reload));
  toast("Sample data loaded."); renderView();
}
async function clearDemo(){
  if (!(await confirmBox("Remove sample data?", "Deletes every entry marked as a sample. Your own records stay untouched.", {okText:"Remove sample data"}))) return;
  const uid = S.user.id;
  const r1 = await sb.from("transactions").delete().eq("user_id",uid).eq("is_demo",true);
  const rest = await Promise.all([ sb.from("budgets").delete().eq("user_id",uid).eq("is_demo",true), sb.from("bills").delete().eq("user_id",uid).eq("is_demo",true), sb.from("savings_goals").delete().eq("user_id",uid).eq("is_demo",true) ]);
  if ([r1, ...rest].some(r => dbErr(r.error,"remove sample data"))) return;
  await Promise.all(["transactions","budgets","bills","goals"].map(reload));
  toast("Sample data removed."); renderView();
}
async function deleteAccount(){
  if (!(await confirmBox("Delete your account?", "This permanently deletes your login and all of your financial records. It cannot be undone.", {okText:"Delete everything", typeToConfirm:"DELETE"}))) return;
  const { error } = await sb.rpc("delete_my_account");
  if (dbErr(error, "delete your account")) return;
  await sb.auth.signOut();
  toast("Your account and data were deleted.");
}

const byId = (arr, id) => arr.find(x => x.id === id);

  "login": () => { closeModal(); authModal("login"); },

  "reset": () => { closeModal(); authModal("reset"); },
  "logout": async () => { await sb.auth.signOut(); },

  "add-tx": () => { closeMenu(); txModal(null); },
  "edit-tx": el => { const t = byId(S.tx, el.dataset.id); t && txModal(t); },
  "del-tx": el => deleteTx(el.dataset.id),
  "more-tx": () => { S.txf.limit += 150; renderView(); },

  "export-range": () => exportTx(S.tx.filter(x => inRange(x, S.rep.from, S.rep.to)).sort((a,b) => a.txn_date.localeCompare(b.txn_date)), `dailybudget-transactions-${S.rep.from}-to-${S.rep.to}.csv`),
  "export-summary": exportSummary,
  "backup": exportBackup,
  "dash-today": () => { S.dashDate = todayISO(); renderView(); },
  "add-budget": el => budgetModal(null, el.dataset.cat),
  "edit-budget": el => { const b = byId(S.budgets, el.dataset.id); b && budgetModal(b); },
  "del-budget": async el => { const b = byId(S.budgets, el.dataset.id); if (!b) return; if (!(await confirmBox("Delete this budget?", `${catLabel(b.category)} budget of ${fmt(b.c)} for ${monthLabel(b.month)}. Your transactions are not affected.`))) return; const { error } = await sb.from("budgets").delete().eq("id", b.id); if (dbErr(error,"delete the budget")) return; toast("Budget deleted."); await reload("budgets"); renderView(); },
  "copy-budgets": copyBudgets,
  "goto-month": el => { S.budgetMonth = el.dataset.m; renderView(); },
  "bill-tab": el => { S.billTab = el.dataset.tab; renderView(); },
  "add-bill": () => billModal(null),
  "edit-bill": el => { const b = byId(S.bills, el.dataset.id); b && billModal(b); },
  "pay-bill": el => { const b = byId(S.bills, el.dataset.id); b && payBillModal(b); },
  "skip-bill": async el => { const b = byId(S.bills, el.dataset.id); if (!b) return; if (!(await confirmBox("Skip to next due date?", `Moves ${b.name} to ${fmtDate(nextDue(b.due_date,b.recurrence))} without recording a payment.`, {okText:"Skip", danger:false}))) return; const { error } = await sb.from("bills").update({ due_date: nextDue(b.due_date, b.recurrence) }).eq("id", b.id); if (dbErr(error,"update the bill")) return; toast("Bill moved to next due date."); await reload("bills"); renderView(); },
  "unpay-bill": async el => { const b = byId(S.bills, el.dataset.id); if (!b) return; const { error } = await sb.from("bills").update({ status:"unpaid" }).eq("id", b.id); if (dbErr(error,"update the bill")) return; toast("Bill marked unpaid."); await reload("bills"); renderView(); },
  "del-bill": async el => { const b = byId(S.bills, el.dataset.id); if (!b) return; if (!(await confirmBox("Delete this bill?", `${b.name} (${fmt(b.c)}). Payments you already recorded stay in your transactions.`))) return; const { error } = await sb.from("bills").delete().eq("id", b.id); if (dbErr(error,"delete the bill")) return; toast("Bill deleted."); await Promise.all([reload("bills"), reload("transactions")]); renderView(); },
  "add-goal": () => goalModal(null),
  "edit-goal": el => { const g = byId(S.goals, el.dataset.id); g && goalModal(g); },
  "goal-add": el => { const g = byId(S.goals, el.dataset.id); g && goalMoneyModal(g, 1); },
  "goal-take": el => { const g = byId(S.goals, el.dataset.id); g && goalMoneyModal(g, -1); },
  "del-goal": async el => { const g = byId(S.goals, el.dataset.id); if (!g) return; if (!(await confirmBox("Delete this goal?", `${g.name} — ${fmt(g.sc)} saved of ${fmt(g.tc)}.`))) return; const { error } = await sb.from("savings_goals").delete().eq("id", g.id); if (dbErr(error,"delete the goal")) return; toast("Goal deleted."); await reload("goals"); renderView(); },
  "load-demo": loadDemo,
  "clear-demo": clearDemo,
  "delete-account": deleteAccount
};
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { e.preventDefault(); closeModal(); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav) { e.preventDefault(); if (S.user) setView(nav.dataset.nav); return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  e.preventDefault();
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener("change", async e => {
  const k = e.target.dataset?.change; if (!k) return;
  if (k === "dash-date") { if (validDate(e.target.value)) { S.dashDate = e.target.value; renderView(); } else toast("Choose a valid date.","error"); }
  if (k === "theme") { applyTheme(e.target.value); await savePrefs({ theme: e.target.value }); }
});

/* =====================================================================
   BOOT + SESSION
   ===================================================================== */
async function enterApp(user){
  S.user = user; S.view = "dashboard"; S.dashDate = todayISO(); S.warned = {};
  $("#root").innerHTML = `<div class="loading">Loading your budget…</div>`;
  const ok = await loadAll();
  if (!ok) { if (S.user) $("#root").innerHTML = `<div class="loading" style="flex-direction:column;gap:1rem"><p>Your data couldn't load.</p><button class="btn primary" onclick="location.reload()">Try again</button></div>`; return; }
  S.loaded = true; renderShell();
}
function leaveApp(){
  S.user = null; S.profile = null; S.tx = []; S.budgets = []; S.bills = []; S.goals = []; S.loaded = false;
  S.prefs = {currency:"USD",daily_limit:0,rollover:false,opening_balance:0,theme:document.documentElement.dataset.theme||"light"};
  closeModal(); renderLanding();
}
async function boot(){
  if (!window.supabase && CONFIGURED) { renderLanding(); toast("Couldn't load the database library. Check your connection and refresh.","error"); return; }
  if (!sb) { renderLanding(); return; }
  sb.auth.onAuthStateChange((event, session) => {
    // Defer work outside the auth callback (recommended by Supabase to avoid deadlocks).
    setTimeout(() => {
      if (event === "PASSWORD_RECOVERY") { newPasswordModal(); }
      if (session?.user && (!S.user || S.user.id !== session.user.id)) enterApp(session.user);
      else if (!session && S.user) { leaveApp(); if (event === "SIGNED_OUT") toast("You're logged out."); }
      if (session?.user) S.user = session.user;
    }, 0);
  });
  const { data } = await sb.auth.getSession();
  if (data?.session?.user) { if (!S.user) enterApp(data.session.user); }
  else renderLanding();
  // Remove auth tokens/codes from the address bar after Supabase has read them.
  if (/access_token|refresh_token|type=recovery|code=/.test(location.hash + location.search)) history.replaceState(null, "", appURL());
}
// Refresh "today" figures when the tab becomes visible on a new day.
let lastDay = todayISO();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.loaded && todayISO() !== lastDay) { lastDay = todayISO(); S.dashDate = lastDay; renderView(); } });
boot();
</script>
